en-r)"/><polyline points="-0.866,-0.5 0,0 0.866,-0.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".035" stroke-linejoin="round"/><polyline points="0,0 0,1" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".03"/></g></g></g><g class="q-in" style="--dx:0.0px;--dy:2.2px;--i:2"><g transform="translate(0.0 0.53)"><g class="q-beat" style="--i:2"><polygon points="0,-1 0.866,-0.5 0,0 -0.866,-0.5" fill="url(#blue-t)"/><polygon points="-0.866,-0.5 0,0 0,1 -0.866,0.5" fill="url(#blue-l)"/><polygon points="0,0 0.866,-0.5 0.866,0.5 0,1" fill="url(#blue-r)"/><polyline points="-0.866,-0.5 0,0 0.866,-0.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".035" stroke-linejoin="round"/><polyline points="0,0 0,1" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".03"/></g></g></g><g clip-path="url(#q-clip)"><rect class="q-shine" x="-3" y="-2" width="1.4" height="4" fill="url(#q-shine)" transform="skewX(-20)"/></g></svg>
